# ---------------------
#     Settings menu    
# ---------------------

screen = <profile> [Atmosphere] [Lighting] [Materials] [Debug] [Post_Processing] 

# Customization.
screen.Sky.columns = 3
screen.Sky_Colors.columns = 3
screen.Blocklight.columns = 3
screen.Skylight.columns = 3
screen.Indirect_Lighting.columns = 3

# Main submenus.
screen.Atmosphere = [Fog] [Sun/Moon] [Sky]
screen.Lighting = [Direct_Lighting] [Indirect_Lighting] [Shadows] 
screen.Materials = [POM] [Emissions] [SSS] [Waving] 
screen.Debug = DEBUG_VIEW DEBUG_BUFFER DEBUG_COVER_SCREEN WHITEWORLD
screen.Post_Processing = [Denoising] [Bloom] [SSR]

# Submenus.
screen.Fog = FOG FOG_DENSITY 
screen.Sun/Moon = SUN_MOON_SIZE_SCALAR SUN_MOON_AXIS_ROTATION
screen.Sky = PBR_SKY LIGHT_INTENSITY <empty> <empty> <empty> <empty> S_R S_M S_S RAYLEIGH_SCATTER_R RAYLEIGH_SCATTER_G RAYLEIGH_SCATTER_B

screen.Direct_Lighting = [Blocklight] [Skylight] [Sunlight]
screen.Sunlight = SUNLIGHT_INTENSITY MOONLIGHT_INTENSITY
screen.Blocklight = <empty> BLOCKLIGHT_INTENSITY <empty> BLOCKLIGHT_R BLOCKLIGHT_G BLOCKLIGHT_B
screen.Skylight = <empty> SKYLIGHT_INTENSITY <empty>

screen.Indirect_Lighting = AMBIENT_OCCLUSION AO_STRENGTH <empty> SSAO_SAMPLES SSAO_RADIUS SSAO_BLUR_RADIUS <empty> <empty> VANILLA_AO

screen.Shadows = [RSM] SHADOWS SHADOW_MAP_RESOLUTION CONTACT_SHADOWS
