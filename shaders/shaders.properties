screen.Bloom = BLOOM BLOOM_RADIUS BLOOM_STRENGTH
screen.SSR = SSR SSR_VISIBILITY SSR_STEPS SSR_QUALITY SSR_ENERGY_THRESHOLD

# Sliders.
sliders = FOG_DENSITY SHADOW_MAP_RESOLUTION NOISE_TEXTURE_RESOLUTION BLOCKLIGHT_INTENSITY SKYLIGHT_INTENSITY SUNLIGHT_INTENSITY MOONLIGHT_INTENSITY WATER_WAVE_AMPLITUDE SSAO_SAMPLES AO_STRENGTH SSAO_RADIUS POM_HEIGHT_SCALE POM_LAYERS SIGMA K_SIGMA THRESHOLD BLOOM_RADIUS BLOOM_STRENGTH DEBUG_BUFFER BLOCKLIGHT_R BLOCKLIGHT_G BLOCKLIGHT_B EMISSION_STRENGTH SSAO_BLUR_RADIUS SUN_MOON_SIZE_SCALAR SUN_MOON_AXIS_ROTATION RSM_SAMPLES RSM_SAMPLE_RADIUS RSM_BRIGHTNESS SSS_SAMPLES SSS_STRENGTH OPTICAL_DENSITY_MULTIPLIER VANILLA_AO SSR_STEPS SSR_VISIBILITY SSR_QUALITY SSR_ENERGY_THRESHOLD LIGHT_INTENSITY S_R S_M S_S  RAYLEIGH_SCATTER_R RAYLEIGH_SCATTER_G RAYLEIGH_SCATTER_B FOLIAGE_WAVE_AMPLITUDE FOLIAGE_WAVE_SPEED

