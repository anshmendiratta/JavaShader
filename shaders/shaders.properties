iris.features.optional = TEXTURE_FILTERING

screen = <profile> [Atmosphere] [Lighting] [Materials] [Water] [Debug] [Post_Processing] 

# Main submenus.
screen.Lighting = [Shadows] [Sky]
# submenus.
screen.Atmosphere = FOG
screen.Shadows = SHADOW_MAP_RESOLUTION NOISE_TEXTURE_RESOLUTION SHADOW_BIAS
screen.Sky = [Blocklight] [Skylight] SUNLIGHT_COLOR_INTENSITY AMBIENT_COLOR_INTENSITY
screen.Blocklight = BLOCKLIGHT_COLOR_R BLOCKLIGHT_COLOR_G BLOCKLIGHT_COLOR_B
screen.Skylight = [Sky_Colors] <empty> <empty> SKYLIGHT_COLOR_R SKYLIGHT_COLOR_G SKYLIGHT_COLOR_B 
screen.Sky_Colors = SKY_COLOR_START_R SKY_COLOR_START_G SKY_COLOR_START_B SKY_COLOR_END_R SKY_COLOR_END_G SKY_COLOR_END_B
screen.SSAO = SSAO SSAO_SAMPLE_COUNT SSAO_RADIUS SSAO_BIAS
screen.Post_Processing = [SSAO] BLOOM

screen.Water = WATER_WAVE_AMPLITUDE
screen.Materials = [POM] NORMAL_MAPPING SPECULAR_MAPPING
screen.Debug = DEBUG_VIEW

screen.POM = POM POM_HEIGHT_SCALE POM_MIN_LAYERS POM_MAX_LAYERS

# Sliders.
sliders = SHADOW_MAP_RESOLUTION NOISE_TEXTURE_RESOLUTION SHADOW_BIAS BLOCKLIGHT_COLOR_R BLOCKLIGHT_COLOR_G BLOCKLIGHT_COLOR_B SKYLIGHT_COLOR_R SKYLIGHT_COLOR_G SKYLIGHT_COLOR_B SUNLIGHT_COLOR_INTENSITY AMBIENT_COLOR_INTENSITY SKY_COLOR_START_R SKY_COLOR_START_G SKY_COLOR_START_B SKY_COLOR_END_R SKY_COLOR_END_G SKY_COLOR_END_B WATER_WAVE_AMPLITUDE SSAO_SAMPLE_COUNT SSAO_RADIUS SSAO_BIAS POM_HEIGHT_SCALE POM_MIN_LAYERS POM_MAX_LAYERS

# Customization.
screen.Sky_Colors.columns = 3
screen.Blocklight.columns = 3
screen.Skylight.columns = 3

# Option disables.
#if BLOOM == 0
program.world0/composite3.enabled = false
program.world0/composite4.enabled = false
#endif
#if SSAO == 0
program.world0/composite.enabled = false
#endif
#if FOG == 0
program.world0/composite2.enabled = false
#endif
