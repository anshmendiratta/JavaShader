# Materials.
screen.POM = POM POM_HEIGHT_SCALE POM_LAYERS POM_DEPTH_WRITE
screen.Emissions = EMISSION_STRENGTH
screen.SSS = SSS SSS_SAMPLES SSS_STRENGTH OPTICAL_DENSITY_MULTIPLIER
screen.Waving = [Foliage] [Water]

screen.Water = WAVING_WATER WATER_WAVE_AMPLITUDE
